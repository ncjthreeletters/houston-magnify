document.getElementById('copyJoin').onclick=async()=>{const b=document.getElementById('copyJoin');try{await navigator.clipboard.writeText('832-895-2125');b.textContent='COPIED';setTimeout(()=>b.textContent='COPY NUMBER',1800);}catch{window.prompt('Copy this number','832-895-2125');}};intro();function start(){try{if(TOKEN==='YOUR_MAPBOX_ACCESS_TOKEN')throw Error('Paste your Mapbox public token into the TOKEN variable in this HTML file.');mapboxgl.accessToken=TOKEN;map=new mapboxgl.Map({container:'map',style:STYLE,center:reduced?center:[-95,29],zoom:reduced?zoom:1.4,bearing:0,pitch:0,projection:'globe',minZoom:0,maxZoom:17,renderWorldCopies:false});map.addControl(new mapboxgl.NavigationControl(),'bottom-right');map.once('load',()=>{prepareArrival();render();locate();if(reduced||skipRequested){finishIntro(skipRequested);return;}titleTimer=setTimeout(()=>{if(!opening)return;document.body.classList.remove('title-visible');introTimer=setTimeout(()=>{if(!opening)return;document.body.classList.remove('dark-start');introTimer=setTimeout(()=>{if(!opening)return;map.once('moveend',()=>{if(opening)finishIntro();});map.flyTo({...arrival,duration:4200,essential:false});},1100);},800);},Math.max(0,3500-(performance.now()-titleStart)));});skip.onclick=()=>{if(arrival)finishIntro(true);else{skipRequested=true;document.body.classList.remove('title-visible');}};map.on('error',()=>{if(opening){document.body.classList.remove('opening','dark-start','title-visible');}document.getElementById('error').textContent='Map resource failed to load. Check your token, published style and internet connection.';});document.getElementById('reset').onclick=()=>{intro();overview();};}catch(e){document.body.classList.remove('opening','dark-start','title-visible');skip.hidden=true;document.getElementById('error').textContent=e.message;}}
skip.onclick=()=>{skipRequested=true;document.body.classList.remove('title-visible');};const script=document.createElement('script');script.src='https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js';script.onload=()=>{if(window.mapboxgl)start();else document.getElementById('error').textContent='Mapbox library unavailable.';};script.onerror=()=>{document.body.classList.remove('opening','dark-start','title-visible');skip.hidden=true;document.getElementById('error').textContent='Mapbox library failed to download.';};document.head.appendChild(script);
</script></body></html>
